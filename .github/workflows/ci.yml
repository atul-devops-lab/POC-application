name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: atul-devops-lab/poc-application

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -v

  dependency-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run pip-audit
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

  build-scan-push:
    runs-on: ubuntu-latest
    needs: [build-and-test, dependency-scan]
    permissions:
      contents: read
      id-token: write
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t poc-application:${{ github.sha }} .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: poc-application:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          vuln-type: "library"
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: "1"

      - name: Upload Trivy results to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: poc-application:${{ github.sha }}
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json

      - name: Upload SBOM as artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cyclonedx.json

      - name: Configure AWS credentials via OIDC
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::595981035245:role/github-actions-poc-application-ecr-push
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Check if image tag already exists in ECR
        id: check-image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if aws ecr describe-images \
            --repository-name ${{ env.ECR_REPOSITORY }} \
            --image-ids imageTag=${{ github.sha }} \
            --region ${{ env.AWS_REGION }} 2>/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Tag and push (same image that was scanned — no rebuild)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.check-image.outputs.exists == 'false'
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          docker tag poc-application:${{ github.sha }} $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}

      - name: Install Cosign
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: sigstore/cosign-installer@v3

      - name: Sign image (keyless, via GitHub OIDC)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          cosign sign --yes ${ECR_REGISTRY}/${ECR_REPOSITORY}:${{ github.sha }}

      - name: Attach SBOM as a signed attestation
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          cosign attest --yes \
            --predicate sbom.cyclonedx.json \
            --type cyclonedx \
            ${ECR_REGISTRY}/${ECR_REPOSITORY}:${{ github.sha }}

      - name: Generate GitHub App token for GitOps push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: gitops-app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.GITOPS_APP_CLIENT_ID }}
          private-key: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
          owner: atul-devops-lab
          repositories: POC-application-gitops

      - name: Update image tag in GitOps repo
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITOPS_TOKEN: ${{ steps.gitops-app-token.outputs.token }}
        run: |
          git clone https://x-access-token:${GITOPS_TOKEN}@github.com/atul-devops-lab/POC-application-gitops.git
          cd POC-application-gitops
          sed -i "s|poc-application:.*|poc-application:${{ github.sha }}|g" manifests/deployment.yaml
          git config user.name "atul-devops-gitops-bot-1[bot]"
          git config user.email "atul-devops-gitops-bot-1[bot]@users.noreply.github.com"
          git add manifests/deployment.yaml
          git commit -m "Update poc-application image to ${{ github.sha }}"
          git push
